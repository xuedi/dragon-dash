# Local development only: a Prometheus with real data so the dashboards are not
# empty. Nothing here is meant for a server.
#
# Host networking, deliberately: it removes the need for veth pairs (which some
# desktop kernels refuse) and lets Prometheus scrape armdash on 127.0.0.1
# while it runs from `just run`.
name: armdash-dev

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - dev-tsdb:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.hwmon
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

volumes:
  dev-tsdb:
