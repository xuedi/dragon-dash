# Scrape config for the deployed stack.
# 60s is ample for smart plug power and room temperature; the storage
# arithmetic in ../../docs/fritzbox-metrics.md assumes it.

global:
  scrape_interval: 60s
  scrape_timeout: 30s
  external_labels:
    host: homeserver

scrape_configs:
  # The board itself: CPU, memory, filesystems, hwmon temperatures.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # armdash, which polls the FRITZ!Box and republishes it.
  - job_name: armdash
    static_configs:
      - targets: ["armdash:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
