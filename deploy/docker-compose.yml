name: dragon-dash

# Deploy target: dragon:/var/docker/dragon-dash/
#
# Not in use yet, development happens on the desktop (see ../README.md).
# Only dragon-dash is reachable from the LAN; the other two are internal.

services:
  fritz-exporter:
    image: pdreker/fritz_exporter:3
    container_name: dragon-dash-fritz-exporter
    restart: unless-stopped
    environment:
      FRITZ_HOSTNAME: ${FRITZ_HOSTNAME:?set in .env}
      FRITZ_USERNAME: ${FRITZ_USERNAME:?set in .env}
      FRITZ_PASSWORD: ${FRITZ_PASSWORD:?set in .env}
      # MUST be 0.0.0.0. The v3.0.0 default is 127.0.0.1, which inside a
      # container means "this container only" and Prometheus cannot scrape it.
      FRITZ_LISTEN_ADDRESS: "0.0.0.0"
      FRITZ_PORT: "9787"
      FRITZ_LOG_LEVEL: INFO
      # Off by default and left off: per-host and per-wifi-client series are the
      # main cardinality risk in this stack. Enable deliberately, not casually.
      FRITZ_HOST_INFO: "false"
      FRITZ_WIFI_CLIENT_INFO: "false"
    expose:
      - "9787"
    networks:
      - dash

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: dragon-dash-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The default is 15d. This project exists to keep data forever.
      - --storage.tsdb.retention.time=10y
      - --web.listen-address=0.0.0.0:9090
      # Needed for the snapshot backup described in the README.
      - --web.enable-admin-api
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      # Loopback only. Reach it from a desktop with:
      #   ssh -N -L 9090:127.0.0.1:9090 dragon
      - "127.0.0.1:9090:9090"
    networks:
      - dash

  dragon-dash:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dragon-dash
    restart: unless-stopped
    volumes:
      - ./data/dragon-dash:/data
    ports:
      # Port 80 is a mapping, not a privilege: the process listens on 8080
      # inside the container and never needs root or CAP_NET_BIND_SERVICE.
      - "80:8080"
    depends_on:
      - prometheus
    networks:
      - dash

networks:
  dash:
    driver: bridge
