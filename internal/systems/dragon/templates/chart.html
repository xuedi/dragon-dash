{{define "chart"}}
{{template "page-top" .Top}}

{{if .Unconfigured}}
  {{template "notice" (dict "Kind" "warning" "Title" "Prometheus is not configured"
      "Body" "Set DD_CORE_PROMETHEUS_URL to draw this chart.")}}
{{else}}
  <div class="box"><div id="dd-chart"></div></div>

  <script>
  // uPlot rather than Chart.js: a year at 60s resolution is ~525k points, and
  // uPlot is built for that. Chart.js would crawl.
  const ddEl = document.getElementById('dd-chart');
  const ddHeight = 340;
  let ddChart = null;
  let ddWidth = 0;
  let ddData = null;

  // uPlot paints onto a canvas, so it cannot inherit the palette the way the
  // rest of the page does. Reading Bulma's own variables keeps the axes legible
  // in both schemes instead of drawing near-black text on a dark page.
  function ddTheme() {
    const cs = getComputedStyle(document.documentElement);
    const get = (n, fallback) => cs.getPropertyValue(n).trim() || fallback;
    return {
      axis: get('--bulma-text-weak', '#7a7a7a'),
      grid: get('--bulma-border-weak', '#ededed'),
    };
  }

  // Nine entries because the Thermals chart draws nine lines: the hottest
  // zone, six named board zones and the two SSDs.
  const ddPalette = [
    '#485fc7','#00d1b2','#f14668','#ffb238','#3e8ed0',
    '#48c78e','#9b5de5','#ff7043','#8a8a8a',
  ];

  function ddDraw(d) {
    ddData = d;
    const theme = ddTheme();
    const axis = {
      stroke: theme.axis,
      grid: { stroke: theme.grid, width: 1 },
      ticks: { stroke: theme.grid, width: 1 },
    };
    const data = [d.time, ...d.series.map(s => s.data)];
    if (ddChart) { ddChart.destroy(); }
    ddWidth = ddEl.clientWidth || 900;
    ddChart = new uPlot({
      width: ddWidth, height: ddHeight,
      scales: {
        x: { time: true },
        // Percentages start at zero, where the distance from zero is the
        // point. Temperatures do not: a whole board sits within a few degrees
        // of itself, and a zero based axis would stack every line into one.
        // Either way the range is pinned, so a single sample cannot make
        // uPlot auto-range the axis out to several years.
        y: { range: (u, min, max) => {
          if (min == null || max == null) return [0, 1];
          if (d.fromZero) return [Math.min(0, min), Math.max(max, min + 1)];
          const pad = Math.max((max - min) * 0.1, 0.5);
          return [min - pad, max + pad];
        } },
      },
      series: [{}, ...d.series.map((s, i) => ({
        label: s.name,
        stroke: ddPalette[i % ddPalette.length],
        width: 1.5,
        // A fresh Prometheus has only a handful of samples; without markers a
        // one-point series draws nothing at all.
        points: { show: d.time.length <= 60 },
      }))],
      axes: [{ ...axis }, { ...axis, label: d.unit || '' }],
    }, data, ddEl);
  }

  function ddLoad() {
    const secs = document.getElementById('dd-range').value;
    const status = document.getElementById('dd-status');
    status.className = 'tag is-light'; status.textContent = 'loading';
    fetch('/s/dragon/api/range?metric={{.Metric}}&window=' + secs)
      .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(new Error(t))))
      .then(d => {
        if (!d.time || d.time.length === 0) {
          status.className = 'tag is-warning'; status.textContent = 'no data';
          return;
        }
        ddDraw(d);
        status.className = 'tag is-success is-light';
        status.textContent = d.series.length > 1
          ? d.series.length + ' series, ' + d.time.length + ' points'
          : d.time.length + ' points';
      })
      .catch(e => {
        status.className = 'tag is-danger';
        status.textContent = String(e.message || e).slice(0, 120);
      });
  }

  // uPlot sizes its canvas once, so the chart has to be told when its column
  // changes width.
  //
  // The width guard matters: resizing the canvas can itself trigger the
  // observer, and without it the two feed each other into a loop.
  function ddResize() {
    if (!ddChart) return;
    const w = ddEl.clientWidth;
    if (!w || w === ddWidth) return;
    ddWidth = w;
    ddChart.setSize({ width: w, height: ddHeight });
  }

  // Two triggers on purpose. The window event covers the ordinary case and
  // fires reliably. The observer additionally catches layout changes that move
  // the column without moving the window, but its callbacks are only delivered
  // while the page is actually rendering, so it is the supplement, not the
  // mechanism.
  window.addEventListener('resize', ddResize);

  // Following the browser from light to dark mid-session needs a repaint; the
  // canvas keeps the colours it was drawn with.
  const ddScheme = window.matchMedia('(prefers-color-scheme: dark)');
  ddScheme.addEventListener('change', () => { if (ddData) ddDraw(ddData); });
  if (typeof ResizeObserver !== 'undefined') {
    const ddObserver = new ResizeObserver(ddResize);
    ddObserver.observe(ddEl);
    // Keep a reference: an observer with no strong reference may be collected.
    window.ddObserver = ddObserver;
  }

  window.addEventListener('DOMContentLoaded', ddLoad);
  if (document.readyState !== 'loading') ddLoad();
  </script>
{{end}}
{{end}}
