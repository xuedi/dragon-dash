{{define "chart"}}
<h1 class="title is-4">{{.Title}}</h1>

{{if .Unconfigured}}
  <div class="notification is-warning">
    <strong>Prometheus is not configured.</strong> Set its URL in <a href="/settings">Settings</a>.
  </div>
{{else}}
  <div class="field is-grouped mb-4">
    <div class="control">
      <div class="select is-small">
        <select id="dd-range" onchange="ddLoad()">
          <option value="3600">last hour</option>
          <option value="21600">last 6 hours</option>
          <option value="86400" selected>last day</option>
          <option value="604800">last week</option>
          <option value="2592000">last 30 days</option>
          <option value="31536000">last year</option>
        </select>
      </div>
    </div>
    <div class="control"><span id="dd-status" class="tag is-light">loading…</span></div>
  </div>

  <div class="box"><div id="dd-chart"></div></div>

  <details class="mt-4">
    <summary class="is-size-7 has-text-grey">PromQL</summary>
    <pre class="is-size-7 mt-2">{{.Query}}</pre>
  </details>

  <script>
  // uPlot rather than Chart.js: a year at 60s resolution is ~525k points, and
  // uPlot is built for that. Chart.js would crawl.
  let ddChart = null;
  function ddLoad() {
    const secs = document.getElementById('dd-range').value;
    const status = document.getElementById('dd-status');
    status.className = 'tag is-light'; status.textContent = 'loading…';
    fetch('/s/dragon/api/range?metric={{.Metric}}&window=' + secs)
      .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(new Error(t))))
      .then(d => {
        if (!d.time || d.time.length === 0) {
          status.className = 'tag is-warning'; status.textContent = 'no data in this range';
          return;
        }
        const data = [d.time, ...d.series.map(s => s.data)];
        const el = document.getElementById('dd-chart');
        if (ddChart) { ddChart.destroy(); }
        ddChart = new uPlot({
          width: el.clientWidth || 900, height: 320,
          scales: { x: { time: true } },
          series: [{}, ...d.series.map((s, i) => ({
            label: s.name, stroke: ['#485fc7','#48c78e','#ffe08a','#f14668'][i % 4], width: 1.5,
          }))],
          axes: [{}, { label: d.unit || '' }],
        }, data, el);
        status.className = 'tag is-success';
        status.textContent = d.time.length + ' points';
      })
      .catch(e => {
        status.className = 'tag is-danger';
        status.textContent = String(e.message || e).slice(0, 200);
      });
  }
  window.addEventListener('DOMContentLoaded', ddLoad);
  if (document.readyState !== 'loading') ddLoad();
  </script>
{{end}}
{{end}}
