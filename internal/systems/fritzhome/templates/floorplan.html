{{define "floorplan"}}
{{template "page-top" .Top}}

{{if not .HasPlan}}
  <div class="notification is-info is-light">
    <p><strong>No floor plan defined yet.</strong></p>
    <p class="mt-2">The plan is data, not code: rooms are polygons, devices are placed by AIN.
      Point <code>DD_SYSTEM_FRITZHOME_FLOORPLAN_FILE</code> at a JSON file.</p>
    <pre class="mt-3 is-size-7">{{.Example}}</pre>
  </div>
{{else}}
<style>
  /* An SVG floor plan is not a Bulma component, so it needs rules of its own.
     Every value is still a Bulma variable, which is what makes the plan follow
     the light and dark palettes instead of staying a white slab. */
  .fp-room    { fill: var(--bulma-scheme-main-ter); }
  .fp-outline { stroke: var(--bulma-text-strong); }
  .fp-wall    { stroke: var(--bulma-text-weak); }
  .fp-label   { fill: var(--bulma-text-weak); }
  .fp-name    { fill: var(--bulma-text-strong); }
</style>
<div class="box">
  <svg viewBox="0 0 {{.W}} {{.H}}" style="width:100%;max-height:75vh" role="img"
       aria-label="apartment floor plan with live sensor readings">

    {{range .Rooms}}
      <polygon class="fp-room" points="{{.Points}}" stroke="none"/>
    {{end}}

    {{if .Outline}}
      <polygon class="fp-outline" points="{{.Outline}}" fill="none"
               stroke-width="6" stroke-linejoin="round"/>
    {{end}}

    {{range .Walls}}
      <polyline class="fp-wall" points="{{.}}" fill="none"
                stroke-width="3" stroke-linecap="round"/>
    {{end}}

    {{/* Doors sit on top of the walls they interrupt, so they read as gaps. */}}
    {{range .Doors}}
      <line x1="{{.X1}}" y1="{{.Y1}}" x2="{{.X2}}" y2="{{.Y2}}"
            stroke="hsl(348, 86%, 61%)" stroke-width="5" stroke-linecap="round"/>
    {{end}}

    {{range .Rooms}}
      <text class="fp-label" x="{{.LabelX}}" y="{{.LabelY}}" font-size="15"
            font-family="Inter, sans-serif">{{.Name}}</text>
    {{end}}

    {{range .Devices}}
      <g>
        <circle cx="{{.X}}" cy="{{.Y}}" r="26" fill="{{.Colour}}" opacity="0.16"/>
        <circle cx="{{.X}}" cy="{{.Y}}" r="19" fill="{{.Colour}}"/>
        <text x="{{.X}}" y="{{.ValueY}}" font-size="13" font-weight="700" fill="#fff"
              text-anchor="middle" font-family="Inter, sans-serif">{{.Value}}</text>
        <text class="fp-name" x="{{.X}}" y="{{.LabelY}}" font-size="13"
              text-anchor="middle" font-family="Inter, sans-serif">{{.Name}}</text>
        {{if .Unit}}<text class="fp-label" x="{{.X}}" y="{{.UnitY}}" font-size="11"
              text-anchor="middle" font-family="Inter, sans-serif">{{.Unit}}</text>{{end}}
      </g>
    {{end}}
  </svg>
</div>

{{end}}
{{end}}
