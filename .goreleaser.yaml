# GoReleaser builds the binary, the archives and every distro package from one
# config. The in-binary version lives in internal/version/version.go, and CI's
# release job makes the tag from that file, so the two cannot disagree. Nothing
# is stamped in at link time, so a tarball built here and a `go build` on a
# laptop report the same version.
version: 2

project_name: armdash

builds:
  - id: armdash
    main: ./cmd/armdash
    binary: armdash
    env:
      # Pure Go, no cgo, so arm64 needs no cross toolchain and the binary runs
      # on any glibc or musl system.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: armdash
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - .env.dist
      - packaging/systemd/armdash.service

nfpms:
  - id: armdash
    package_name: armdash
    vendor: armdash
    homepage: https://github.com/xuedi/armdash
    maintainer: Daniel Koch <xuedi@beijingcode.org>
    description: A single-binary dashboard for a home server, reading everything from Prometheus.
    license: EUPL-1.2
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/armdash.service
        dst: /usr/lib/systemd/system/armdash.service
      # Seeded into /etc by the post-install, which never overwrites an existing
      # file. Shipping it straight to /etc would let an upgrade clobber the
      # credentials.
      - src: .env.dist
        dst: /usr/share/armdash/armdash.env.example
    scripts:
      postinstall: packaging/nfpm/postinstall.sh
    # A dashboard with no Prometheus to read shows empty charts, so name it, but
    # it may equally well live on another host.
    recommends:
      - prometheus
    # Up to 0.11.0 the project was called dragon-dash. This package takes the
    # old one's place rather than installing next to it.
    replaces:
      - dragon-dash
    conflicts:
      - dragon-dash

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: xuedi
    name: armdash
