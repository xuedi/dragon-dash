# GoReleaser builds the binary, the archives and every distro package from one
# config. The in-binary version lives in internal/version/version.go and the
# release tag must equal it, which the `just release` guard enforces. Nothing is
# stamped in at link time, so a tarball built here and a `go build` on a laptop
# report the same version.
version: 2

project_name: dragon-dash

builds:
  - id: dragon-dash
    main: ./cmd/dragon-dash
    binary: dragon-dash
    env:
      # Pure Go, no cgo, so arm64 needs no cross toolchain and the binary runs
      # on any glibc or musl system.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: dragon-dash
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - .env.dist
      - packaging/systemd/dragon-dash.service

nfpms:
  - id: dragon-dash
    package_name: dragon-dash
    vendor: dragon-dash
    homepage: https://github.com/xuedi/dragon-dash
    maintainer: Daniel Koch <xuedi@beijingcode.org>
    description: A single-binary dashboard for a home server, reading everything from Prometheus.
    license: EUPL-1.2
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/dragon-dash.service
        dst: /usr/lib/systemd/system/dragon-dash.service
      # Seeded into /etc by the post-install, which never overwrites an existing
      # file. Shipping it straight to /etc would let an upgrade clobber the
      # credentials.
      - src: .env.dist
        dst: /usr/share/dragon-dash/dragon-dash.env.example
    scripts:
      postinstall: packaging/nfpm/postinstall.sh
    # A dashboard with no Prometheus to read shows empty charts, so name it, but
    # it may equally well live on another host.
    recommends:
      - prometheus

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: xuedi
    name: dragon-dash
